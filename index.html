<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/kuncho-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Ethiopic faces: Sans for Amharic text (the seasonal greeting), Serif
         for the Ge'ez numerals the background canvas already asks for. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@400;600;700&family=Noto+Serif+Ethiopic:wght@700&display=swap" />
    <title>KUNCHO Operations Dashboard</title>
    <!-- Apply dark class before React renders to prevent flash -->
    <script>if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark')</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
